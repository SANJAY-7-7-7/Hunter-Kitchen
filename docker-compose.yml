version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 18 Relational Primary Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: hunters_kitchen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hunters_kitchen}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Internal database network; no host port publishing in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-hunters_kitchen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hunters_network

  # ----------------------------------------------------------------------------
  # Redis Fast Caching, Distributed Pub/Sub & Rate-Limiting Engine
  # Hardened with password authentication and Append-Only persistence
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hunters_kitchen_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-hunters_redis_secure_pass_2026}"]
    # Internal cache network; no host port publishing in production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hunters_redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hunters_network

  # ----------------------------------------------------------------------------
  # Hunter's Kitchen Node.js / Express Application Server (Primary Worker)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunters_kitchen_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-hunters_kitchen}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hunters_redis_secure_pass_2026}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hunters_redis_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_MAPS_PLATFORM_KEY: ${GOOGLE_MAPS_PLATFORM_KEY}
    expose:
      - "3000"
    networks:
      - hunters_network

  # ----------------------------------------------------------------------------
  # Hunter's Kitchen Node.js Application Server (Secondary Replica / Failover)
  # ----------------------------------------------------------------------------
  app_replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunters_kitchen_app_replica
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-hunters_kitchen}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hunters_redis_secure_pass_2026}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hunters_redis_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_MAPS_PLATFORM_KEY: ${GOOGLE_MAPS_PLATFORM_KEY}
    expose:
      - "3000"
    networks:
      - hunters_network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy, Load Balancer & TLS 1.3 SSL Termination Engine
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: hunters_kitchen_load_balancer
    restart: unless-stopped
    depends_on:
      - app
      - app_replica
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - hunters_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hunters_network:
    driver: bridge
